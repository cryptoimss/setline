name: Publicar Setline PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v6

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar la versión publicable
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -R assets _site/assets
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" _site/sw.js

      - name: Empaquetar la web
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
